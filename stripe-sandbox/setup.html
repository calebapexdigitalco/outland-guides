<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect Stripe Sandbox — Outland Guides</title>
<style>body{margin:0;background:#1a1a1a;color:#fdfdfd;font:16px/1.6 system-ui,sans-serif}main{max-width:560px;margin:10vh auto;padding:32px}h1{font-size:34px;line-height:1.15}p{color:#ccc}label{display:block;font-weight:700}input{box-sizing:border-box;width:100%;margin:12px 0 24px;padding:16px;border:1px solid #777;border-radius:8px;background:#292923;color:#fff;font-size:16px}button,a{display:inline-block;border:0;border-radius:40px;background:#a5592e;color:white;padding:14px 24px;font:700 14px system-ui;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}#status{overflow-wrap:anywhere}</style>
<style>[hidden]{display:none!important}</style>
<main><p>OUTLAND GUIDES · PRIVATE LOCAL SETUP</p><h1>Connect your Stripe sandbox.</h1><p>Paste the replacement sandbox secret key below. It goes only to the local server on this computer and is saved outside the website and repository. Live keys are not accepted.</p>
<form id="setup"><label for="key">Sandbox secret key</label><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="sk_test_…" required><button>Connect sandbox</button></form><p id="status" role="status" aria-live="polite"></p><a id="continue" href="/payments.html" hidden>Open payment page</a></main>
<script>
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);
document.getElementById('setup').addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button'),input=document.getElementById('key'),status=document.getElementById('status');button.disabled=true;status.textContent='Checking your sandbox connection…';try{const response=await fetch('/api/stripe/setup',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Token':token},body:JSON.stringify({secret:input.value})});const data=await response.json();input.value='';if(!response.ok)throw Error(data.error);e.target.hidden=true;status.textContent='Connected. Your key is stored privately on this computer.';document.getElementById('continue').hidden=false}catch(error){input.value='';status.textContent=error.message}finally{button.disabled=false}});
</script></html>
