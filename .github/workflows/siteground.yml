name: Website checks and SiteGround deployment

on:
  push:
    branches: [main]
    paths:
      - 'outputs/**'
      - 'scripts/**'
      - '.github/workflows/siteground.yml'
  pull_request:
    paths:
      - 'outputs/**'
      - 'scripts/**'
      - '.github/workflows/siteground.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outland-siteground-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check website files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: python3 scripts/check-site.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  deploy:
    name: Publish to SiteGround
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SITEGROUND_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://outlandguides.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Upload website and verify public release
        env:
          SITEGROUND_HOST: ${{ secrets.SITEGROUND_HOST }}
          SITEGROUND_USER: ${{ secrets.SITEGROUND_USER }}
          SITEGROUND_PORT: ${{ secrets.SITEGROUND_PORT }}
          SITEGROUND_PATH: ${{ secrets.SITEGROUND_PATH }}
          SITEGROUND_SSH_KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          SITEGROUND_KNOWN_HOSTS: ${{ secrets.SITEGROUND_KNOWN_HOSTS }}
        run: python3 scripts/deploy-siteground.py
